name: Deploy generated project to Cloudflare Pages
on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Cloudflare Pages project name
        required: true
        type: string
      branch:
        description: Source repository branch
        required: true
        default: main
        type: string
      repository:
        description: owner/repository to build and deploy
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN_JARVIS }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run project tests when available
        run: npm test --if-present
      - name: Build project
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-pages-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-pages-dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Create Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ inputs.project_name }}
          BRANCH: ${{ inputs.branch }}
        run: wrangler pages project create "$PROJECT_NAME" --production-branch "$BRANCH" || true
      - name: Deploy static build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ inputs.project_name }}
          BRANCH: ${{ inputs.branch }}
        run: wrangler pages deploy dist --project-name "$PROJECT_NAME" --branch "$BRANCH"
