name: JARVIS X checks
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, jarvis-x-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: deno check supabase/functions/jarvis-chat/index.ts supabase/functions/jarvis-agent/index.ts
