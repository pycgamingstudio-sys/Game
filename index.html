<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ed">
  <meta name="description" content="JARVIS X — your private personal AI workspace.">
  <title>JARVIS X — Private Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/jarvis-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <aside id="sidebar" class="sidebar">
      <a class="brand" href="#"><span class="brand-mark small">✳</span><span>JARVIS <b>X</b><small>PRIVATE INTELLIGENCE</small></span></a>
      <button id="new-chat" class="new-chat"><span>＋</span> New chat <kbd>⌘ K</kbd></button>
      <nav class="primary-nav">
        <button class="nav-item selected" data-view="chat"><span>▤</span> Chats</button>
        <button class="nav-item" data-view="projects"><span>◇</span> Projects</button>
        <button class="nav-item" data-view="tools"><span>✧</span> Agent studio</button>
        <button class="nav-item" data-view="memory"><span>⌑</span> Memory</button>
        <button class="nav-item" data-view="activity"><span>◷</span> Activity & approvals</button>
        <button class="nav-item" data-view="integrations"><span>⌘</span> Integrations</button>
      </nav>
      <div class="history-heading">RECENT</div><div id="history-list" class="history-list"></div>
      <div class="sidebar-bottom"><div class="plan-card"><span class="plan-icon">✧</span><div><b>Local workspace</b><small>Only on this device</small></div><span class="plan-dot"></span></div></div>
    </aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
    <main class="main-panel">
      <header class="topbar"><button id="menu-button" class="icon-button menu-toggle" aria-label="Open menu">☰</button><div class="breadcrumb">Workspace <span>/</span> <b>New conversation</b></div><div class="topbar-right"><span id="theme-note" class="theme-note"></span><select id="model-select" aria-label="Choose model"><option value="gemini-3.8-flash">Gemini 3.8 Flash</option><option value="gemini-3.1-pro-preview">Gemini 3.1 Pro (Preview)</option></select><button id="settings-button" class="icon-button settings-button" title="Integrations and settings">⚙</button></div></header>
      <section id="messages" class="messages"></section>
      <footer class="composer-wrap"><div class="composer-shell"><div id="attachment-note" class="attachment-note" hidden></div><textarea id="composer-input" rows="1" placeholder="Talk to JARVIS X..." aria-label="Message JARVIS X"></textarea><div class="composer-actions"><div class="composer-left"><button id="attach-button" class="tool-button" title="Attach files">＋ <span>Attach</span></button><input id="file-input" type="file" multiple hidden accept="image/*,application/pdf,.txt,.md,.csv,.json,.xml,.log"><button id="voice-button" class="tool-button" title="Voice input">♩ <span>Voice</span></button></div><div class="composer-right"><span class="composer-hint">Shift + Enter for new line</span><button id="send-button" class="send-button" aria-label="Send message">↑</button></div></div></div><p class="disclaimer">Private local workspace · JARVIS X can make mistakes; verify important actions.</p></footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script>
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
  <script type="module" src="/src/main.js"></script>
</body></html>
